<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Dekara Designs</title><meta name="description" content="Customise this piece in 3D."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f1c19'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' text-anchor='middle' fill='%23c9a46a'%3EC%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#f7f3ed"><meta property="og:type" content="website"><meta property="og:site_name" content="Dekara Designs"><meta property="og:title" content="Product | Dekara Designs"><meta property="og:description" content="Customise this piece in 3D."><meta name="twitter:card" content="summary_large_image"></head><body>
<main class="wrap pdp"><div><div class="stage"><canvas id="p-canvas"></canvas><span class="hint">Drag to rotate · scroll to zoom</span></div><div class="gallery" id="p-gallery"></div></div>
<div><span class="eyebrow" id="p-tag"></span><h1 id="p-name" style="font-size:clamp(2.2rem,4vw,3.6rem)"></h1><p class="lead" id="p-desc" style="margin-top:.8rem"></p><p class="price" id="p-price"></p><small style="color:var(--mut)">Estimated price. Final quote confirmed by our team.</small>
<div class="studio"><h3>Custom Studio</h3><label>Fabric · <span id="p-col" style="color:var(--ink)"></span></label><div class="sw" id="p-sw"></div><label>Frame finish · <span id="p-fin"></span></label><div class="sw" id="p-fsw"></div>
<div class="rg"><div><span>Width</span><b id="o-w"></b></div><input type="range" id="r-w" min="80" max="140" value="100"></div><div class="rg"><div><span>Depth</span><b id="o-d"></b></div><input type="range" id="r-d" min="80" max="140" value="100"></div><div class="rg"><div><span>Height</span><b id="o-h"></b></div><input type="range" id="r-h" min="80" max="130" value="100"></div></div>
<div class="spec" id="p-spec"></div><div class="hero-ctl"><button class="btn" id="p-add">Add to basket</button><button class="btn ghost" id="p-ar">View in AR</button><button class="btn ghost" id="p-cmp" data-cmp="">Compare</button><button class="btn ghost" id="p-wish" data-wish="" data-label="1">♡ Save to wishlist</button><a class="btn ghost" href="basket.html">View basket</a></div></div></main><section id="reviews" style="padding-top:0"><div class="wrap"><span class="eyebrow">Customer reviews</span><h2>What customers say</h2><div class="rev" style="margin-top:2rem"><div><div id="rev-sum"></div><div id="rev-list"></div></div><div><form id="rev-form" hidden><h3 style="margin-bottom:1rem">Write a review</h3><label>Rating<select id="rv-r"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Average</option><option value="2">★★ Poor</option><option value="1">★ Terrible</option></select></label><label>Title<input id="rv-t" required maxlength="80"></label><label>Your review<textarea id="rv-b" rows="4" required maxlength="1000"></textarea></label><button class="btn" type="submit">Submit review</button><p class="st-note" id="rv-msg"></p></form><p id="rev-signin" class="st-note" hidden>Please <a href="account.html?next=product.html" style="border-bottom:1px solid var(--bronze)">sign in</a> to write a review.</p></div></div></div></section>
<section style="padding-top:0"><div class="wrap"><span class="eyebrow">You may also like</span><h2>Related pieces</h2><div class="cards" id="related"></div></div></section>
<script src="js/app.js"></script></body></html>
